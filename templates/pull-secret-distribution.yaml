{{- if eq .Values.global.clusterPlatform "Azure" }}
---
# Distribute the cluster pull secret to workload namespaces for Azure peer-pods.
# Peer-pods (kata-remote) CVMs do not use the KBS authenticated_registry_credentials_uri
# for image pulls. Instead, the pull secret must be available via the standard
# Kubernetes imagePullSecrets mechanism on the default service account.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: pull-secret-distribution-policy
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  {{- $namespaces := list "hello-openshift" "kbs-access" }}
  {{- range $ns := $namespaces }}
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: pull-secret-copy-{{ $ns }}
      spec:
        remediationAction: enforce
        severity: medium
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            metadata:
              name: pull-secret
              namespace: {{ $ns }}
            type: kubernetes.io/dockerconfigjson
            data:
              .dockerconfigjson: '{{ `{{ fromSecret "openshift-config" "pull-secret" ".dockerconfigjson" }}` }}'
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: pull-secret-link-{{ $ns }}
      spec:
        remediationAction: enforce
        severity: medium
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: default
              namespace: {{ $ns }}
            imagePullSecrets:
            - name: pull-secret
  {{- end }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: pull-secret-distribution-placement-binding
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
placementRef:
  name: pull-secret-distribution-placement-rule
  kind: PlacementRule
  apiGroup: apps.open-cluster-management.io
subjects:
  - name: pull-secret-distribution-policy
    kind: Policy
    apiGroup: policy.open-cluster-management.io
---
apiVersion: apps.open-cluster-management.io/v1
kind: PlacementRule
metadata:
  name: pull-secret-distribution-placement-rule
spec:
  clusterConditions:
    - status: 'True'
      type: ManagedClusterConditionAvailable
  clusterSelector:
    matchLabels:
      cloud: Azure
---
{{- end }}
